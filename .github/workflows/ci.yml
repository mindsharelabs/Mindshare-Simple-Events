name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      WP_DIR: /tmp/wordpress

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, intl
          tools: wp-cli
          coverage: none

      - name: Install WordPress with the plugin active
        run: |
          wp core download --path="$WP_DIR" --quiet
          wp config create --path="$WP_DIR" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --path="$WP_DIR" --url=http://localhost --title=CI --admin_user=admin --admin_password=admin --admin_email=ci@example.com --skip-email
          wp rewrite structure '/%postname%/' --path="$WP_DIR"
          ln -s "$GITHUB_WORKSPACE" "$WP_DIR/wp-content/plugins/Mindshare-Simple-Events"
          wp plugin activate Mindshare-Simple-Events --path="$WP_DIR"

      - run: composer install --no-interaction --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit
        env:
          WP_LOAD_PATH: ${{ env.WP_DIR }}/wp-load.php

  coding-standards:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer lint

  php74-syntax:
    name: PHP 7.4 syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: Lint every plugin file on PHP 7.4
        run: |
          find mindshare-events.php uninstall.php inc templates -name '*.php' -print0 \
            | xargs -0 -n1 php -l

  compiled-css:
    name: Compiled CSS is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fail if the build changed anything
        run: git diff --exit-code -- css/

  package:
    name: Release zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bin/build-zip.sh
      - name: Check the zip holds the plugin and nothing else
        run: |
          zip=dist/Mindshare-Simple-Events.zip
          listing=$(unzip -Z1 "$zip")
          for required in mindshare-events.php uninstall.php LICENSE.txt inc/core/events.php templates/single-events.php js/mindevents.js css/style.css blocks/calendar/block.json blocks/calendar/editor.js languages/simple-events.pot; do
            echo "$listing" | grep -qx "Mindshare-Simple-Events/$required" || { echo "Missing: $required"; exit 1; }
          done
          if echo "$listing" | grep -E '/(tests|sass|\.github|@docs|bin|vendor|node_modules)/|composer\.|package(-lock)?\.json|phpunit|\.phpcs|gulpfile|\.map$'; then
            echo "Development files in the release zip"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Mindshare-Simple-Events
          path: dist/Mindshare-Simple-Events.zip
